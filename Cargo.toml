[package]
name = "ascii-game-of-life"
version = "0.1.0"
edition = "2021"
description = "A full-color ASCII/braille Conway's Game of Life terminal screensaver"
license = "MIT"
authors = ["Pierre Baudin <34721711+pvbaudin@users.noreply.github.com>"]
repository = "https://github.com/pvbaudin/ascii-game-of-life"
homepage = "https://github.com/pvbaudin/ascii-game-of-life"
readme = "README.md"
keywords = ["game-of-life", "conway", "terminal", "ascii-art", "screensaver"]
categories = ["command-line-utilities", "games"]

[[bin]]
name = "life"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
libc = "0.2"
pdf-extract = { version = "0.7", optional = true }

[features]
default = ["pdf"]
pdf = ["dep:pdf-extract"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
